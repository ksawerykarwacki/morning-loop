  top_of_list: "the one ticket or review that unblocks the sprint goal or a teammate soonest"
  voice: "ticket-first and short: key-free names, the state, the next action"
sections:
  on: [state_of_world, top_of_list, solve, ask, decisions, your_turn, chat, coaching, findings]
