  - {id: ticket_quality_check, signal: jira_state, job: "Is the next ticket ready to build? Before refinement", skill: ticket-quality-check, bucket: draft, external_action: none}
  - {id: stall_escalation, signal: jira_state, job: "A ticket of yours stuck in review or blocked: name the next action", skill: stall-escalation, bucket: draft, external_action: none}
  - {id: routine_health, signal: daily, job: "Did yesterday's and today's brief land?", skill: null, bucket: decision, external_action: none}
gaps:
